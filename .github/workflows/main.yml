name: Android Plasma Mobile Port Compiler

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Plasma Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android NDK and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ kconfig-frontends gettext
        
        echo "Installing Android NDK..."
        sudo mkdir -p /usr/local/lib/android/sdk/ndk
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        sudo mv android-ndk-r26b /usr/local/lib/android/sdk/ndk/26.1.10909125
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

        echo "Building fresh Extra CMake Modules (ECM) from KDE source..."
        git clone https://invent.kde.org/frameworks/extra-cmake-modules.git
        cd extra-cmake-modules
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr
        sudo make install
        cd ../..
        rm -rf extra-cmake-modules

    - name: Configure C++ Cross-Compilation for Android (ARM64)
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DBUILD_TESTING=OFF

    - name: Compile Native Plasma Binaries
      run: |
        cd build
        make -j$(nproc)
