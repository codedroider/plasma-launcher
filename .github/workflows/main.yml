name: Android Plasma Mobile Port Compiler

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Plasma Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android NDK and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ extra-cmake-modules kconfig-frontends libkf5coreaddons-dev gettext
        echo "Installing Android NDK..."
        sudo mkdir -p /usr/local/lib/android/sdk/ndk
        wget -q https://google.com
        unzip -q android-ndk-r26b-linux.zip
        sudo mv android-ndk-r26b /usr/local/lib/android/sdk/ndk/26.1.10909125
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Configure C++ Cross-Compilation for Android (ARM64)
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DBUILD_TESTING=OFF

    - name: Compile Native Plasma Binaries
      run: |
        cd build
        make -j$(nproc)
