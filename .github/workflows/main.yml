name: Android Plasma Mobile Port Compiler

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Plasma Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tools and Qt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ extra-cmake-modules kconfig-frontends libkf5coreaddons-dev gettext

    - name: Configure C++ Cross-Compilation for Android (ARM64)
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DBUILD_TESTING=OFF

    - name: Compile Native Plasma Binaries
      run: |
        cd build
        make -j$(nproc)
